# Base PostgreSQL propia del modulo de Pagos (solo DEMO: credenciales de ejemplo).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pagos
      POSTGRES_USER: pagos
      POSTGRES_PASSWORD: pagos
    ports:
      - "5432:5432"
    volumes:
      - pagos-data:/var/lib/postgresql/data

volumes:
  pagos-data:
