openapi: 3.1.0
info:
  title: DeliveryGo API - Consolidado MVP Ecosistema Completo
  description: "API unificada para el MVP de DeliveryGo. Integra los módulos de Usuarios, Pedidos, Logística, Comercios y Catálogo, Notificaciones, Opiniones y Analítica, y Pagos con autenticación JWT Bearer y control de errores estandarizado."
  version: "1.4.0"
servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo
paths:
  # ==========================================
  # MÓDULO DE USUARIOS Y AUTENTICACIÓN
  # ==========================================
  /api/v1/auth/register:
    post:
      tags:
      - Autenticación
      summary: Registrar usuario
      description: Crea un usuario con rol CLIENTE, estado ACTIVO y email único.
      operationId: registrarUsuario
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarUsuarioRequest"
      responses:
        "201":
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          description: Datos de solicitud inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []

  /api/v1/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: Autentica mediante email y password, emitiendo un JWT.
      operationId: iniciarSesion
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada y JWT emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: La cuenta está inactiva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []

  /api/v1/auth/password/forgot:
    post:
      tags:
      - Autenticación
      summary: Solicitar recuperación de contraseña
      description: Solicita el envío de un token de recuperación a Notificaciones.
      operationId: solicitarRecuperacionPassword
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "202":
          description: Solicitud aceptada para procesamiento
      security: []

  # ==========================================
  # MÓDULO DE PEDIDOS (CU-01 a CU-05)
  # ==========================================
  /api/v1/orders:
    post:
      tags:
      - Pedidos
      summary: CU-01 — Crear pedido o borrador
      description: Crea un pedido en estado BORRADOR, sin items y con total cero.
      operationId: crearPedido
      parameters:
        - name: X-Cliente-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 11111111-1111-1111-1111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPedidoRequest"
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoResponse"
        "200":
          description: Borrador abierto ya existente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoResponse"
        "400":
          description: VALIDATION_ERROR — falta un dato, cliente no activo o dirección no válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: MIXED_MERCHANT — ya existe un borrador abierto de otro comercio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DEPENDENCY_UNAVAILABLE — Usuarios no responde

  /api/v1/orders/{id}:
    get:
      tags:
      - Pedidos
      summary: CU-05 — Consultar pedido y estado
      description: Devuelve el pedido con sus items y su historial de estados.
      operationId: consultarPedido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Cliente-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 11111111-1111-1111-1111-111111111111
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoResponse"
        "400":
          description: VALIDATION_ERROR — identificador mal formado o falta cabecera
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ORDER_NOT_FOUND — el pedido no existe o pertenece a otro cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Pedidos
      summary: CU-04 — Cancelar pedido
      description: Cancela el pedido pasando su estado a CANCELADO (borrado lógico).
      operationId: cancelarPedido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Cliente-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 11111111-1111-1111-1111-111111111111
      responses:
        "200":
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoResponse"
        "400":
          description: VALIDATION_ERROR — formato inválido o cabecera faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ORDER_NOT_FOUND — pedido inexistente o de otro cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ORDER_INVALID_STATE — el pedido no se puede cancelar en su estado actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: PAYMENT_REJECTED — Pagos no reembolsó el dinero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DEPENDENCY_UNAVAILABLE — Pagos no responde

  /api/v1/orders/{id}/items:
    post:
      tags:
      - Pedidos
      summary: CU-02 — Agregar items
      description: Agrega líneas nuevas a un pedido en BORRADOR y recalcula el total.
      operationId: agregarItems
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Cliente-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 11111111-1111-1111-1111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgregarItemsPedidoRequest"
      responses:
        "200":
          description: Pedido actualizado con el total recalculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoResponse"
        "400":
          description: VALIDATION_ERROR — lista vacía, cantidad inválida o producto repetido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ORDER_NOT_FOUND — pedido inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ORDER_INVALID_STATE — el pedido no está en BORRADOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: MIXED_MERCHANT o PRODUCT_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DEPENDENCY_UNAVAILABLE — Catálogo no responde

  /api/v1/orders/{id}/items/{productoId}:
    put:
      tags:
      - Pedidos
      summary: CU-02 — Modificar la cantidad de un item
      description: Reemplaza la cantidad de una línea existente en un pedido BORRADOR.
      operationId: modificarCantidadItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 33333333-3333-3333-3333-333333333333
        - name: X-Cliente-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 11111111-1111-1111-1111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModificarCantidadItemRequest"
      responses:
        "200":
          description: Pedido actualizado con el total recalculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoResponse"
        "400":
          description: VALIDATION_ERROR — cantidad <= 0 o producto no presente en el pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ORDER_NOT_FOUND — pedido inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ORDER_INVALID_STATE — pedido no en BORRADOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: MIXED_MERCHANT o PRODUCT_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DEPENDENCY_UNAVAILABLE — Catálogo no responde
    delete:
      tags:
      - Pedidos
      summary: CU-02 — Eliminar un item
      description: Elimina una línea de un pedido BORRADOR (operación idempotente).
      operationId: quitarItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 44444444-4444-4444-4444-444444444444
        - name: X-Cliente-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 11111111-1111-1111-1111-111111111111
      responses:
        "200":
          description: Pedido actualizado con el total recalculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoResponse"
        "400":
          description: VALIDATION_ERROR — formato o cabecera inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ORDER_NOT_FOUND — pedido inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ORDER_INVALID_STATE — pedido no en BORRADOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{id}/confirm:
    post:
      tags:
      - Pedidos
      summary: CU-03 — Confirmar pedido
      description: Revalida el pedido, procesa el cobro con Pagos y lo pasa a CONFIRMADO.
      operationId: confirmarPedido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Cliente-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 11111111-1111-1111-1111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmarPedidoRequest"
      responses:
        "200":
          description: Pedido confirmado y asociado al pago
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoResponse"
        "400":
          description: VALIDATION_ERROR — medio de pago faltante, pedido sin items o datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ORDER_NOT_FOUND — pedido inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ORDER_INVALID_STATE — el pedido no está en BORRADOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: PAYMENT_REJECTED, PRICE_CHANGED, PRODUCT_UNAVAILABLE o MIXED_MERCHANT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DEPENDENCY_UNAVAILABLE — Usuarios, Catálogo o Pagos no responde

  # ==========================================
  # MÓDULO DE LOGÍSTICA Y REPARTIDORES
  # ==========================================
  /api/v1/couriers:
    post:
      tags:
      - Repartidores
      summary: CU-01 Registrar repartidor
      description: Da de alta un repartidor vinculado a un usuario existente, con su vehículo. Queda ACTIVO y NO_DISPONIBLE.
      operationId: registrar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarRepartidorRequest"
      responses:
        "201":
          description: Repartidor registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepartidorResponse"
        "400":
          description: VALIDATION_ERROR / VEHICLE_PLATE_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: COURIER_DNI_DUPLICATED / COURIER_ALREADY_REGISTERED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: USER_NOT_ELIGIBLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/couriers/{id}/availability:
    patch:
      tags:
      - Repartidores
      summary: CU-02 Cambiar disponibilidad del repartidor
      description: El repartidor titular se pone DISPONIBLE o NO_DISPONIBLE.
      operationId: cambiarDisponibilidad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: X-Usuario-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarDisponibilidadRequest"
      responses:
        "200":
          description: Disponibilidad actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepartidorResponse"
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: COURIER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: COURIER_HAS_ACTIVE_DELIVERY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: COURIER_INACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/deliveries/assign:
    post:
      tags:
      - Entregas
      summary: CU-03 Asignar repartidor a una entrega
      description: Crea o reutiliza la entrega de un pedido confirmado y asigna un repartidor disponible.
      operationId: asignar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsignarEntregaRequest"
      responses:
        "201":
          description: Entrega ASIGNADA a un repartidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntregaResponse"
        "202":
          description: No hay repartidores disponibles, queda PENDIENTE_ASIGNACION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntregaResponse"
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ORDER_NOT_FOUND / COURIER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: DELIVERY_ALREADY_EXISTS / CONCURRENT_UPDATE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: ORDER_NOT_CONFIRMED / COURIER_NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/deliveries/{id}/pickup:
    post:
      tags:
      - Entregas
      summary: CU-04 Registrar retiro del pedido
      description: El repartidor informa que retiró el pedido del comercio (ASIGNADA a RETIRADA).
      operationId: registrarRetiro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: X-Usuario-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarRetiroRequest"
      responses:
        "200":
          description: Entrega RETIRADA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntregaResponse"
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: COURIER_NOT_ASSIGNED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: DELIVERY_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: DELIVERY_INVALID_STATE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/deliveries/{id}/complete:
    post:
      tags:
      - Entregas
      summary: CU-05 Confirmar entrega del pedido
      description: El repartidor confirma la entrega con el código del cliente.
      operationId: confirmarEntrega
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: X-Usuario-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmarEntregaRequest"
      responses:
        "200":
          description: Entrega COMPLETADA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntregaResponse"
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: COURIER_NOT_ASSIGNED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: DELIVERY_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: DELIVERY_NOT_PICKED_UP / DELIVERY_INVALID_STATE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: INVALID_CONFIRMATION_CODE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================
  # MÓDULO DE COMERCIOS Y CATÁLOGO
  # ==========================================
  /api/v1/catalogo:
    get:
      tags:
      - Catálogo
      summary: Buscar catálogo
      description: Devuelve una página de productos activos y disponibles de comercios activos (RN-05) que cumplen los criterios.
      operationId: buscarCatalogo
      parameters:
        - name: texto
          in: query
          required: false
          schema:
            type: string
        - name: categoriaId
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: comercioId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: precioMin
          in: query
          required: false
          schema:
            type: number
        - name: precioMax
          in: query
          required: false
          schema:
            type: number
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Página de resultados, puede estar vacía
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoResponseDTO"
        "400":
          description: Criterios inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"

  /api/v1/categorias:
    get:
      tags:
      - Categorías
      summary: Listar categorías
      description: Devuelve todas las categorías del catálogo global. Endpoint público sin token.
      operationId: listarCategorias
      responses:
        "200":
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoriaDTO"
    post:
      tags:
      - Categorías
      summary: Crear categoría
      description: Agrega una categoría al catálogo global. Solo rol Administrador.
      operationId: crearCategoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequestDTO"
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaDTO"
        "400":
          description: Nombre faltante (RN-06)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "401":
          description: Falta el token o es inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "403":
          description: Usuario sin rol ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
      security:
      - bearerAuth: []

  /api/v1/categorias/{id}:
    put:
      tags:
      - Categorías
      summary: Modificar categoría
      description: Cambia el nombre de una categoría. Solo rol Administrador.
      operationId: modificarCategoria
      parameters:
