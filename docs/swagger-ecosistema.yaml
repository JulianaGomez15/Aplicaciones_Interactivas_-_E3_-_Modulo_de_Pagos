            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

  # ==========================================
  # MÓDULO DE PAGOS
  # ==========================================
  /api/v1/payments:
    get:
      tags:
      - Pagos
      summary: Listar pagos (CU-06 / CU-07)
      description: 'Listado paginado y filtrable para auditoria y metricas. Con `codigoPedido` devuelve todos los
        intentos de pago de un pedido (CU-07): si no tiene pagos, 200 con la lista vacia.


        Orden: `sort=campo,asc|desc` con campo en fechaCreacion, fechaActualizacion, monto o estado (por defecto fechaCreacion,desc).
        Tamano maximo de pagina: 100.


        **Roles:** ADMINISTRADOR, ANALISTA, SERVICIO_LECTURA.'
      operationId: API-06_listarPagos
      parameters:
      - name: estado
        in: query
        description: Estado del pago
        required: false
        schema:
          type: string
          enum:
          - PENDIENTE
          - APROBADO
          - RECHAZADO
          - NO_AUTORIZADO
          - ERROR
          - REEMBOLSADO
      - name: codigoUsuario
        in: query
        description: Codigo del usuario que pago
        required: false
        schema:
          type: string
          format: uuid
      - name: codigoPedido
        in: query
        description: 'Codigo del pedido (CU-07: intentos de pago del pedido)'
        required: false
        schema:
          type: string
          format: uuid
      - name: desde
        in: query
        description: Fecha de creacion desde (inclusive), formato yyyy-MM-dd
        required: false
        schema:
          type: string
          format: date
        example: 2026-09-01
      - name: hasta
        in: query
        description: Fecha de creacion hasta (inclusive), formato yyyy-MM-dd
        required: false
        schema:
          type: string
          format: date
        example: 2026-09-30
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple
          sort criteria are supported.'
        required: false
        schema:
          type: array
          default:
          - fechaCreacion,DESC
          items:
            type: string
      responses:
        '200':
          description: Pagina de resultados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPagosResponse'
        '400':
          description: 'VALIDATION_ERROR: filtros, fechas o sort invalidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    post:
      tags:
      - Pagos
      summary: Iniciar pago (CU-01 / CU-09)
      description: 'Registra un intento de pago para un pedido pendiente de pago (BORRADOR) y lo resuelve en el momento
        con la **autorizacion simulada** (sorteo): 70 % APROBADO, 10 % RECHAZADO por fondos insuficientes, 10 % NO_AUTORIZADO
        (el banco no autorizo) y 10 % ERROR (intente de nuevo, con otra clave de control). El `estado` y el `motivo`
        vuelven en la respuesta. Con `autorizacion.automatica=false` el pago queda PENDIENTE hasta approve / reject.


        **Idempotencia (RN-01):** si la `claveControl` ya existe con los mismos datos (pedido, usuario, monto y medio
        de pago) responde **200** con el pago original sin crear otro; con datos distintos responde **409 DUPLICATE_PAYMENT_REQUEST**.
        Un pago RECHAZADO no se reintenta con la misma clave: hace falta una nueva.


        **Valida contra otros modulos:** usuario activo (INT-02), medio de pago activo y propio, pedido pendiente
        de pago y monto igual al total (INT-01). Si Pedidos o Usuarios no responden: 503 y no se crea el pago.


        **Rol:** SERVICIO_ESCRITURA (JWT de servicio de Pedidos).'
      operationId: API-01_iniciarPago
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPagoRequest'
        required: true
      responses:
        '201':
          description: Pago creado; `estado` informa el resultado de la autorizacion simulada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoResponse'
        '200':
          description: 'La clave de control ya se uso con los mismos datos: se devuelve el pago existente'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoResponse'
        '400':
          description: VALIDATION_ERROR (campos faltantes o con formato invalido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'UNAUTHORIZED: falta el JWT o no es valido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'FORBIDDEN: el rol no tiene permiso de escritura'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'DUPLICATE_PAYMENT_REQUEST: la clave de control ya se uso con datos distintos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: PAYMENT_AMOUNT_MISMATCH, PAYMENT_USER_INVALID, ORDER_NOT_PAYABLE o PAYMENT_METHOD_INVALID (medio
            inexistente, inactivo o de otro usuario)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'EXTERNAL_SERVICE_UNAVAILABLE: Pedidos o Usuarios no respondieron; no se crea el pago'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/payments/{codigoPago}/refund:
    post:
      tags:
      - Pagos
      summary: Reembolsar pago (CU-05)
      description: 'Reembolso total o parcial, simulado, de un pago APROBADO. El monto no puede superar lo disponible
        (monto aprobado menos lo ya reembolsado). Un reembolso parcial deja el pago APROBADO; el que cubre el total
        lo pasa a REEMBOLSADO y lo registra en el historial.


        **Idempotencia (RN-10):** repetir la `claveControl` del reembolso devuelve **200** con el reembolso existente.


        **Roles:** SERVICIO_ESCRITURA, ADMINISTRADOR.'
      operationId: API-05_reembolsarPago
      parameters:
      - name: codigoPago
        in: path
        description: Codigo publico del pago
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReembolsoRequest'
        required: true
      responses:
        '201':
          description: Reembolso registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReembolsoResponse'
        '200':
          description: 'La clave de control del reembolso ya se uso: se devuelve el reembolso existente'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReembolsoResponse'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PAYMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'PAYMENT_INVALID_STATE: el pago no esta APROBADO (incluye REEMBOLSADO) / DUPLICATE_PAYMENT_REQUEST
            si la clave se uso con otros datos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'REFUND_EXCEEDS_AMOUNT: el monto supera lo disponible'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/payment-methods:
    post:
      tags:
      - Medios de pago
      summary: Registrar medio de pago (CU-08)
      description: 'Registra un medio de pago simulado para el **usuario del JWT** (el cuerpo no lleva codigo de usuario).
        Se guardan solo los ultimos 4 digitos (RN-08); el numero completo se descarta.


        Tipos: TARJETA_CREDITO, TARJETA_DEBITO (13 a 19 digitos), BILLETERA_VIRTUAL, TRANSFERENCIA.


        **Rol:** CLIENTE.'
      operationId: API-07_registrarMedioPago
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedioPagoRequest'
        required: true
      responses:
        '201':
          description: Medio de pago creado y activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedioPagoResponse'
        '400':
          description: VALIDATION_ERROR (faltan campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: PAYMENT_METHOD_INVALID (tipo no soportado o numero invalido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'FORBIDDEN: el rol no es CLIENTE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/payments/{codigoPago}/reject:
    patch:
      tags:
      - Pagos
      summary: Rechazar pago - modo manual (CU-03)
      description: '**Solo para el modo manual** (`autorizacion.automatica=false`). Por defecto el pago ya sale resuelto
        de `POST /api/v1/payments` (sorteo) y **Pedidos no necesita llamar a esta operacion**: sobre un pago ya resuelto
        solo responde 200 (si ya esta RECHAZADO) o 409.


        Rechazo manual: PENDIENTE -> RECHAZADO, con el motivo en el historial. Pide el aviso de rechazo a Notificaciones.
        El pedido no avanza (RN-03). Rechazar un pago ya RECHAZADO devuelve 200 sin cambios (RN-10); si esta APROBADO
        o REEMBOLSADO, 409. Para reintentar hay que crear un pago nuevo con otra clave de control.


        **Rol:** SERVICIO_ESCRITURA.'
      operationId: API-03_rechazarPago
      parameters:
      - name: codigoPago
        in: path
        description: Codigo publico del pago
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RechazarPagoRequest'
      responses:
        '200':
          description: Pago RECHAZADO (tambien si ya lo estaba)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoResponse'
        '400':
          description: VALIDATION_ERROR (motivo demasiado largo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PAYMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'PAYMENT_INVALID_STATE: el pago esta APROBADO o REEMBOLSADO'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/payments/{codigoPago}/approve:
    patch:
      tags:
      - Pagos
      summary: Autorizar pago - modo manual (CU-02)
      description: '**Solo para el modo manual** (`autorizacion.automatica=false`). Por defecto el pago ya sale resuelto
        de `POST /api/v1/payments` (sorteo) y **Pedidos no necesita llamar a esta operacion**: sobre un pago ya resuelto
        solo responde 200 (si ya esta APROBADO) o 409.


        Autorizacion manual: PENDIENTE -> APROBADO. Registra el cambio en el historial y pide el comprobante a Notificaciones
        (si Notificaciones falla, el pago queda aprobado igual).


        Con la respuesta, Pedidos confirma el pedido (RN-03). Aprobar un pago ya APROBADO devuelve 200 sin cambios
        (RN-10); si ya esta en otro estado final, 409.


        **Rol:** SERVICIO_ESCRITURA.'
      operationId: API-02_aprobarPago
      parameters:
      - name: codigoPago
        in: path
        description: Codigo publico del pago
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Pago APROBADO (tambien si ya lo estaba)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoResponse'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PAYMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'PAYMENT_INVALID_STATE: el pago esta RECHAZADO o REEMBOLSADO'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/payments/{codigoPago}:
    get:
      tags:
      - Pagos
      summary: Consultar pago (CU-04)
      description: 'Busca por el codigo publico (nunca por el id interno). Un usuario con rol CLIENTE solo puede ver
        sus propios pagos (se compara el `codigoUsuario` del JWT).


        **Roles:** CLIENTE (solo sus pagos), ADMINISTRADOR, SERVICIO_LECTURA.'
      operationId: API-04_consultarPago
      parameters:
      - name: codigoPago
        in: path
        description: Codigo publico del pago
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoResponse'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'FORBIDDEN: rol sin permiso, o pago de otro usuario'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PAYMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/payments/{codigoPago}/history:
    get:
      tags:
      - Pagos
      summary: Historial de estados del pago (CU-10)
      description: 'Linea de tiempo completa del pago, ordenada por fecha, incluida el alta (estadoAnterior nulo).


        **Rol:** ADMINISTRADOR.'
      operationId: API-08_consultarHistorial
      parameters:
      - name: codigoPago
        in: path
        description: Codigo publico del pago
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Historial del pago
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistorialEstadoResponse'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PAYMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/payment-methods/{codigoMedioPago}:
    delete:
      tags:
      - Medios de pago
      summary: Eliminar medio de pago
      description: Desactiva un medio de pago del usuario del JWT sin borrar los pagos historicos. Repetir la solicitud
        devuelve 204. **Rol:** CLIENTE.
      operationId: API-09_eliminarMedioPago
      parameters:
      - name: codigoMedioPago
        in: path
        description: Codigo publico del medio de pago
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Medio de pago desactivado; sin cuerpo
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'FORBIDDEN: el medio pertenece a otro usuario'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'PAYMENT_METHOD_NOT_FOUND: no existe el medio de pago'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []

components:
  schemas:
    # Schemas Comercios y Catálogo
    CambiarDisponibilidadRequestDTO:
      type: object
      properties:
        disponible:
          type: boolean
      required:
      - disponible

    CambiarEstadoProductoRequestDTO:
      type: object
      properties:
        activo:
          type: boolean
      required:
      - activo

    CatalogoResponseDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductoResponseDTO"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64

    CategoriaDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string

    CategoriaRequestDTO:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
      required:
      - nombre

    ComercioResponseDTO:
      type: object
      properties:
        cuit:
          type: string
        estado:
          type: string
        id:
          type: integer
          format: int64
        razonSocial:
          type: string

    CrearComercioRequestDTO:
      type: object
      properties:
        cuit:
          type: string
          minLength: 1
          pattern: "\\d{11}"
        direccion:
          type: string
          minLength: 1
        razonSocial:
          type: string
          minLength: 1
        rubro:
          type: string
          minLength: 1
      required:
      - cuit
      - direccion
      - razonSocial
      - rubro

    CrearProductoRequestDTO:
      type: object
      properties:
        categoriaIds:
          type: array
          items:
            type: integer
            format: int64
          minItems: 1
        comercioId:
          type: integer
          format: int64
        descripcion:
          type: string
          minLength: 1
        nombre:
          type: string
          minLength: 1
        precio:
          type: number
      required:
      - categoriaIds
      - comercioId
      - descripcion
      - nombre
      - precio

    ErrorResponseDTO:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        path:
          type: string
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time

    ModificarComercioRequestDTO:
      type: object
      properties:
        direccion:
          type: string
          minLength: 1
        razonSocial:
          type: string
          minLength: 1
        rubro:
          type: string
          minLength: 1
      required:
      - direccion
      - razonSocial
      - rubro

    ModificarPrecioRequestDTO:
      type: object
      properties:
        nuevoPrecio:
          type: number
      required:
      - nuevoPrecio

    ProductoResponseDTO:
      type: object
      properties:
        categorias:
          type: array
          items:
            $ref: "#/components/schemas/CategoriaDTO"
        comercioId:
          type: integer
          format: int64
        disponible:
          type: boolean
        estado:
          type: string
        id:
          type: integer
          format: int64
        nombre:
          type: string
        precio:
          type: number

    SucursalDTO:
      type: object
      properties:
        comercioId:
          type: integer
          format: int64
        direccion:
          type: string
        id:
          type: integer
          format: int64

    SucursalRequestDTO:
      type: object
      properties:
        direccion:
          type: string
          minLength: 1
      required:
      - direccion

    # Schemas Logística y Repartidores
    RegistrarRetiroRequest:
      type: object
      properties:
        observacion:
          type: string
          maxLength: 255
          minLength: 0

    ConfirmarEntregaRequest:
      type: object
      properties:
        codigoConfirmacion:
          type: string
          minLength: 1
        observacion:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - codigoConfirmacion

    AsignarEntregaRequest:
      type: object
      properties:
        pedidoId:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        comercioId:
          type: integer
          format: int64
        direccionRetiro:
          type: string
          minLength: 1
        direccionEntrega:
          type: string
          minLength: 1
        repartidorId:
          type: integer
          format: int64
      required:
      - clienteId
      - comercioId
      - direccionEntrega
      - direccionRetiro
      - pedidoId

    RegistrarRepartidorRequest:
      type: object
      properties:
        usuarioId:
          type: integer
          format: int64
        nombre:
          type: string
          minLength: 1
        apellido:
          type: string
          minLength: 1
        dni:
          type: string
          minLength: 1
          pattern: "\\d{7,8}"
        telefono:
          type: string
          minLength: 1
        vehiculo:
          $ref: "#/components/schemas/VehiculoDTO"
      required:
      - apellido
      - dni
      - nombre
      - telefono
      - usuarioId
      - vehiculo

    VehiculoDTO:
      type: object
      properties:
        tipo:
          type: string
          enum:
          - BICICLETA
          - MOTO
          - AUTO
        patente:
          type: string
        descripcion:
          type: string
      required:
      - tipo

    RepartidorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        nombre:
          type: string
        apellido:
          type: string
        dni:
          type: string
        telefono:
          type: string
        estado:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
        disponibilidad:
          type: string
          enum:
          - DISPONIBLE
          - NO_DISPONIBLE
          - OCUPADO
        vehiculo:
          $ref: "#/components/schemas/VehiculoDTO"
        fechaAlta:
          type: string
          format: date-time

    CambiarDisponibilidadRequest:
      type: object
      properties:
        disponibilidad:
          type: string
          enum:
          - DISPONIBLE
          - NO_DISPONIBLE
          - OCUPADO
      required:
      - disponibilidad

    EntregaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pedidoId:
          type: integer
          format: int64
        repartidorId:
          type: integer
          format: int64
        estado:
          type: string
          enum:
          - PENDIENTE_ASIGNACION
          - ASIGNADA
          - RETIRADA
          - EN_CAMINO
          - COMPLETADA
          - CANCELADA
        fechaCreacion:
          type: string
          format: date-time
        fechaAsignacion:
          type: string
          format: date-time
        fechaRetiro:
          type: string
          format: date-time
        fechaEntrega:
          type: string
          format: date-time

    # Schemas Pedidos
    CrearPedidoRequest:
      type: object
      description: Datos mínimos para abrir un pedido en BORRADOR
      properties:
        comercioId:
          type: string
          format: uuid
          example: 99999999-9999-9999-9999-999999999999
        direccionEntregaId:
          type: string
          format: uuid
          example: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
      required: [comercioId, direccionEntregaId]

    AgregarItemsPedidoRequest:
      type: object
      description: Líneas nuevas de un pedido en BORRADOR
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LineaItem"
      required: [items]

    LineaItem:
      type: object
      properties:
        productoId:
          type: string
          format: uuid
          example: 33333333-3333-3333-3333-333333333333
        cantidad:
          type: integer
          format: int32
          minimum: 1
          example: 2
      required: [cantidad, productoId]

    ModificarCantidadItemRequest:
      type: object
      properties:
        cantidad:
          type: integer
          format: int32
          minimum: 1
          example: 5
      required: [cantidad]

    ConfirmarPedidoRequest:
      type: object
      properties:
        medioPago:
          type: string
          example: TARJETA_CREDITO
      required: [medioPago]

    PedidoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clienteId:
          type: string
          format: uuid
        comercioId:
          type: string
          format: uuid
        direccionEntregaId:
          type: string
          format: uuid
        estado:
          type: string
          enum: [BORRADOR, CONFIRMADO, EN_PREPARACION, EN_CAMINO, ENTREGADO, CANCELADO]
        total:
          type: number
        moneda:
          type: string
        pagoId:
          type: string
          format: uuid
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemResponse"
        historial:
          type: array
          items:
            $ref: "#/components/schemas/HistorialResponse"

    ItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productoId:
          type: string
          format: uuid
        nombreProducto:
          type: string
        cantidad:
          type: integer
          format: int32
        precioUnitario:
          type: number
        subtotal:
          type: number

    HistorialResponse:
      type: object
      properties:
        estadoAnterior:
          type: string
          enum: [BORRADOR, CONFIRMADO, EN_PREPARACION, EN_CAMINO, ENTREGADO, CANCELADO]
        estadoNuevo:
          type: string
          enum: [BORRADOR, CONFIRMADO, EN_PREPARACION, EN_CAMINO, ENTREGADO, CANCELADO]
        fechaCambio:
          type: string
          format: date-time
        motivo:
          type: string

    # Schemas Usuarios
    RegistrarUsuarioRequest:
      type: object
      properties:
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Pérez
        email:
          type: string
          format: email
          example: ana.perez@example.com
        telefono:
          type: string
          example: "+54 11 5555 0101"
        password:
          type: string
          example: "ClaveDemo2026!"
      required: [nombre, apellido, email, password]

    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Pérez
        email:
          type: string
          example: ana.perez@example.com
        rol:
          type: string
          example: CLIENTE
        estado:
          type: string
          example: ACTIVO

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: ana.perez@example.com
        password:
          type: string
          example: "ClaveDemo2026!"
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        tipo:
          type: string
          example: Bearer
        expiraEn:
          type: string
          format: date-time
        usuarioId:
          type: integer
          format: int64

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: La solicitud contiene datos inválidos
        path:
          type: string
          example: /api/v1/orders
        correlationId:
          type: string
          example: 0affd3bd-9ef5-4fe2-9057-2f74cd3b179d

    # Schemas Notificaciones
    PlantillaRequestDto:
      type: object
      properties:
        nombre:
          type: string
          example: PEDIDO_ENTREGADO_EMAIL
        asunto:
          type: string
          example: Pedido entregado
        cuerpo:
          type: string
          example: "Hola {nombre}, tu pedido {pedidoId} fue entregado."
        canal:
          type: string
          enum: [EMAIL, PUSH, IN_APP]
          example: EMAIL
      required: [asunto, cuerpo, nombre]

    PlantillaResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: PEDIDO_CONFIRMADO_EMAIL
        asunto:
          type: string
          example: Pedido confirmado
        cuerpo:
          type: string
          example: "Hola {nombre}, tu pedido {pedidoId} fue confirmado."
        activa:
          type: boolean
          example: true
        canal:
          type: string
          example: EMAIL
        variables:
          type: array
          items:
            type: string

    CrearNotificacionRequestDto:
      type: object
      properties:
        destinatarioId:
          type: integer
          format: int64
          example: 10
        plantillaId:
          type: integer
          format: int64
          example: 1
        canal:
          type: string
          enum: [EMAIL, PUSH, IN_APP]
          example: EMAIL
        parametros:
          type: object
          additionalProperties:
            type: string
      required: [destinatarioId, plantillaId]

    NotificacionResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        destinatarioId:
          type: integer
          format: int64
          example: 10
        plantillaId:
          type: integer
          format: int64
          example: 1
        canal:
          type: string
          example: EMAIL
        estado:
          type: string
          enum: [PENDIENTE, ENVIADA, FALLIDA, FALLIDA_DEFINITIVA]
          example: ENVIADA
        cantidadIntentos:
          type: integer
          example: 1

    IntentoEnvioResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        exitoso:
          type: boolean
          example: true
        motivoFallo:
          type: string

    CanalDto:
      type: object
      properties:
        tipo:
          type: string
          example: EMAIL
        nombre:
          type: string
          example: Correo electrónico
        activo:
          type: boolean
          example: true

    CanalEstadoRequestDto:
      type: object
      properties:
        activo:
          type: boolean
          example: false
      required: [activo]

    # Schemas Opiniones y Analítica
    ResenaRequest:
      type: object
      properties:
        pedidoId:
          type: integer
          format: int64
          example: 501
        tipoObjetivo:
          type: string
          enum: [COMERCIO, REPARTIDOR]
          example: COMERCIO
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comentario:
          type: string
          example: Entrega rápida y atención cordial
      required: [pedidoId, tipoObjetivo, puntuacion]

    ResenaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 9001
        usuarioId:
          type: integer
          format: int64
          example: 100
        pedidoId:
          type: integer
          format: int64
          example: 501
        tipoObjetivo:
          type: string
          example: COMERCIO
        objetivoId:
          type: integer
          format: int64
          example: 10
        puntuacion:
          type: integer
          example: 5
        comentario:
          type: string
          nullable: true
          example: Buena atención
        fechaCreacion:
          type: string
          format: date-time
          example: "2025-01-31T14:30:00"

    RatingResponse:
      type: object
      properties:
        objetivoId:
          type: integer
          format: int64
          example: 10
        tipoObjetivo:
          type: string
          example: COMERCIO
        promedio:
          type: number
          nullable: true
          example: 4.75
        cantidadResenas:
          type: integer
          format: int64
          example: 12

    DashboardResponse:
      type: object
      properties:
        generadoEn:
          type: string
          format: date-time
          example: "2025-01-31T14:30:00"
        metricas:
          type: array
          items:
            $ref: "#/components/schemas/MetricaResumen"
        parcial:
          type: boolean
          example: false

    MetricaResumen:
      type: object
      properties:
        fuente:
          type: string
          example: RESENAS
        tipoMetrica:
          type: string
          example: CANTIDAD_RESENAS
        periodoDesde:
          type: string
          format: date
          example: "2025-01-01"
        periodoHasta:
          type: string
          format: date
          example: "2025-01-31"
        valor:
          type: number
          nullable: true
          example: 25.0

    # Schemas Pagos y Medios de Pago
    MedioPagoResumenResponse:
      type: object
      description: Medio de pago utilizado (solo datos enmascarados)
      properties:
        tipo:
          type: string
          enum:
          - TARJETA_CREDITO
          - TARJETA_DEBITO
          - BILLETERA_VIRTUAL
          - TRANSFERENCIA
          example: TARJETA_CREDITO
        detalleEnmascarado:
          type: string
          example: '**** **** **** 1234'
    PagoResponse:
      type: object
      description: 'Pago: estado actual, monto y medio de pago enmascarado'
      properties:
        codigoPago:
          type: string
          format: uuid
          description: Codigo publico del pago (nunca se expone el id interno)
        codigoPedido:
          type: string
          format: uuid
        estado:
          type: string
          enum:
          - PENDIENTE
          - APROBADO
          - RECHAZADO
          - NO_AUTORIZADO
          - ERROR
          - REEMBOLSADO
          example: PENDIENTE
        motivo:
          type:
          - string
          - 'null'
          description: 'Motivo del estado cuando el pago no se aprobo (fondos insuficientes, el banco no autorizo, error:
            intente de nuevo). Null si esta PENDIENTE o APROBADO'
          example: Fondos insuficientes
        monto:
          type: number
          example: 15000.0
        moneda:
          type: string
          example: ARS
        medioPago:
          $ref: '#/components/schemas/MedioPagoResumenResponse'
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time
    CrearPagoRequest:
      type: object
      description: Solicitud de pago que envia el Servicio de Pedidos
      properties:
        codigoPedido:
          type: string
          format: uuid
          description: Codigo del pedido a pagar (debe estar pendiente de pago, estado BORRADOR)
          example: 00000000-0000-0000-0001-000000000001
        codigoUsuario:
          type: string
          format: uuid
          description: Codigo del usuario que paga (debe existir y estar activo)
          example: 00000000-0000-0000-0000-000000000001
        codigoMedioPago:
          type: string
          format: uuid
          description: Codigo del medio de pago (debe estar activo y pertenecer al usuario)
        monto:
          type: number
          description: 'Importe: debe coincidir exactamente con el total del pedido (RN-02)'
          example: 15000.0
          exclusiveMinimum: 0
        moneda:
          type: string
          description: Moneda (codigo de 3 letras)
          example: ARS
          minLength: 1
          pattern: '[A-Za-z]{3}'
        claveControl:
          type: string
          description: 'Clave de control (idempotencia, RN-01): la misma clave con los mismos datos devuelve el pago
            existente; con datos distintos responde 409'
          example: pedido-0001-intento-1
          maxLength: 100
          minLength: 0
      required:
      - claveControl
      - codigoMedioPago
      - codigoPedido
      - codigoUsuario
      - moneda
      - monto
    ReembolsoResponse:
      type: object
      description: Reembolso registrado (simulado)
      properties:
        codigoReembolso:
          type: string
          format: uuid
        codigoPago:
          type: string
          format: uuid
        monto:
          type: number
          example: 5000.0
        estado:
          type: string
          enum:
          - APROBADO
          example: APROBADO
        montoDisponible:
          type: number
          description: Cuanto queda disponible para reembolsar en el pago
          example: 10000.0
        fechaSolicitud:
          type: string
          format: date-time
        fechaResolucion:
          type: string
          format: date-time
    ReembolsoRequest:
      type: object
      description: Solicitud de reembolso total o parcial
      properties:
        monto:
          type: number
          description: Monto a devolver; no puede superar lo disponible (monto aprobado menos lo ya reembolsado)
          example: 5000.0
          exclusiveMinimum: 0
        motivo:
          type: string
          example: Pedido cancelado por el cliente
          maxLength: 255
          minLength: 0
        claveControl:
          type: string
          description: 'Clave de control del reembolso (RN-10): repetirla devuelve el reembolso existente'
          example: reembolso-0001-1
          maxLength: 100
          minLength: 0
      required:
      - claveControl
      - monto
      - motivo
    MedioPagoResponse:
      type: object
      description: Medio de pago registrado (solo datos enmascarados)
      properties:
        codigoMedioPago:
          type: string
          format: uuid
        tipo:
          type: string
          enum:
          - TARJETA_CREDITO
          - TARJETA_DEBITO
          - BILLETERA_VIRTUAL
          - TRANSFERENCIA
          example: TARJETA_CREDITO
        detalleEnmascarado:
          type: string
          example: '**** **** **** 1234'
        activo:
          type: boolean
    MedioPagoRequest:
      type: object
      description: Alta de medio de pago. El usuario se toma del JWT, no del cuerpo.
      properties:
        tipo:
          type: string
          enum:
          - TARJETA_CREDITO
          - TARJETA_DEBITO
          - BILLETERA_VIRTUAL
          - TRANSFERENCIA
          example: TARJETA_CREDITO
          minLength: 1
        numero:
          type: string
          description: 'Numero simulado (13 a 19 digitos para tarjetas). Solo viaja en esta solicitud: se guardan unicamente
            los ultimos 4 y el resto se descarta (RN-08)'
          example: 4111 1111 1111 1234
          maxLength: 64
          minLength: 0
      required:
      - numero
      - tipo
    RechazarPagoRequest:
      type: object
      description: Motivo del rechazo simulado
      properties:
        motivo:
          type: string
          description: Motivo del rechazo (opcional; por defecto 'Rechazo simulado')
          example: Fondos insuficientes
          maxLength: 255
          minLength: 0
    PaginaPagosResponse:
      type: object
      description: Pagina de pagos
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PagoResponse'
        page:
          type: integer
          format: int32
          description: Numero de pagina (base 0)
          example: 0
        size:
          type: integer
          format: int32
          example: 20
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    HistorialEstadoResponse:
      type: object
      description: Un cambio de estado del pago
      properties:
        estadoAnterior:
          type:
          - string
          - 'null'
          description: Null en el alta del pago
          enum:
          - PENDIENTE
          - APROBADO
          - RECHAZADO
          - NO_AUTORIZADO
          - ERROR
          - REEMBOLSADO
          example: PENDIENTE
        estadoNuevo:
          type: string
          enum:
          - PENDIENTE
          - APROBADO
          - RECHAZADO
          - NO_AUTORIZADO
          - ERROR
          - REEMBOLSADO
          example: APROBADO
        motivo:
          type: string
        fecha:
          type: string
          format: date-time

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      description: Token obtenido en POST /auth/login o por el módulo de usuarios
      scheme: bearer
      bearerFormat: JWT