# Perfil "postgres": mvn spring-boot:run -Dspring-boot.run.profiles=postgres  (levantar antes: docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:5432/pagos
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=pagos
spring.datasource.password=pagos
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
