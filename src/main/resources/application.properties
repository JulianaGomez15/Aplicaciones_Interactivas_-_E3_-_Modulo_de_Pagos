spring.application.name=deliverygo-pagos
server.port=8089

spring.datasource.url=jdbc:h2:mem:pagos
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.data.web.pageable.max-page-size=100
springdoc.swagger-ui.path=/swagger-ui.html

# SOLO DEMO ACADEMICA. En produccion usar secret manager / variables de entorno.
app.jwt.secret=DeliveryGo-Pagos-Grupo3-Secret-Key-Demo-2026-Must-Be-Long-Enough
app.jwt.expiration-minutes=60

# --- Integraciones con otros modulos (INT-01 Pedidos, INT-02 Usuarios, INT-03 Notificaciones) ---
# simulado = usa los *ClientSimulado (datos fijos, no hace HTTP). rest = llama de verdad a los otros servicios.
integraciones.modo=simulado
integraciones.pedidos.url=http://localhost:8081
integraciones.usuarios.url=http://localhost:8082
integraciones.notificaciones.url=http://localhost:8083
# Cuanto esperamos como maximo a otro servicio antes de responder 503.
integraciones.timeout-conexion-ms=2000
integraciones.timeout-lectura-ms=3000
# JWT de servicio con el que Pagos se identifica ante los otros modulos (lo emite Usuarios). Vacio = no se envia.
integraciones.token-servicio=
