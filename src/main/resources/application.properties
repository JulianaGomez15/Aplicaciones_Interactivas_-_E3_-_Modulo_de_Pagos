spring.application.name=deliverygo-pagos
server.port=8089

spring.datasource.url=jdbc:h2:mem:pagos
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.data.web.pageable.max-page-size=100
springdoc.swagger-ui.path=/swagger-ui.html

# SOLO DEMO ACADEMICA. En produccion usar secret manager / variables de entorno.
app.jwt.secret=DeliveryGo-Pagos-Grupo3-Secret-Key-Demo-2026-Must-Be-Long-Enough
app.jwt.expiration-minutes=60
app.cors.allowed-origin=http://localhost:5173
